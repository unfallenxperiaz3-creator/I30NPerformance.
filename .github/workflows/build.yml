name: Compilar APK desde zip

on:
  push:
    paths:
      - 'mi-i30n.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q mi-i30n.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: proyecto/mi-i30n
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp proyecto/mi-i30n/app/build/outputs/apk/debug/app-debug.apk MiI30N.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi i30 N (compilación ${{ github.run_number }})
          files: MiI30N.apk
